<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900" role="img" aria-label="선생님 화면 예시 — 엑셀에서 복사한 단어를 붙여넣어 단어장을 만드는 세팅 화면">
  <!-- ※ 예시 화면입니다. 실제 앱 스크린샷(PNG/WebP)으로 교체하세요. -->
  <defs>
    <clipPath id="s-screen"><rect width="440" height="900" rx="20"/></clipPath>
    <style>
      .t { font-family: Pretendard, system-ui, -apple-system, 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      .m { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#s-screen)">
    <rect width="440" height="900" fill="#FCFAFF"/>

    <text class="t" x="30" y="40" fill="#6B6480" font-size="16" font-weight="600">9:41</text>
    <rect x="372" y="27" width="30" height="14" rx="4" fill="#6B6480" opacity=".4"/>

    <!-- 헤더 -->
    <text class="t" x="24" y="90" fill="#6B6480" font-size="14" font-weight="600">3학년 2반 · 13주차</text>
    <text class="t" x="24" y="120" fill="#211A33" font-size="24" font-weight="700">단어장 만들기</text>

    <!-- 단계 -->
    <g class="t" font-size="13" font-weight="700">
      <rect x="24" y="142" width="112" height="30" rx="15" fill="#7C3AED"/>
      <text x="80" y="162" fill="#fff" text-anchor="middle">1 붙여넣기</text>
      <rect x="144" y="142" width="96" height="30" rx="15" fill="#F3EEFF"/>
      <text x="192" y="162" fill="#7C3AED" text-anchor="middle">2 확인</text>
      <rect x="248" y="142" width="96" height="30" rx="15" fill="#F3EEFF"/>
      <text x="296" y="162" fill="#7C3AED" text-anchor="middle">3 배포</text>
    </g>

    <!-- 붙여넣기 영역 -->
    <rect x="24" y="192" width="392" height="286" rx="16" fill="#fff" stroke="#7C3AED" stroke-width="1.5"/>
    <text class="t" x="44" y="222" fill="#6B6480" font-size="13" font-weight="600">엑셀에서 복사해 그대로 붙여넣으세요</text>
    <g class="m" font-size="15">
      <text x="44" y="256" fill="#211A33">abandon</text>      <text x="230" y="256" fill="#6B6480">버리다</text>
      <text x="44" y="288" fill="#211A33">reluctant</text>    <text x="230" y="288" fill="#6B6480">꺼리는</text>
      <text x="44" y="320" fill="#211A33">sustain</text>      <text x="230" y="320" fill="#6B6480">지속하다</text>
      <text x="44" y="352" fill="#211A33">deliberate</text>   <text x="230" y="352" fill="#6B6480">신중한</text>
      <text x="44" y="384" fill="#211A33">accumulate</text>   <text x="230" y="384" fill="#6B6480">모으다</text>
      <text x="44" y="416" fill="#211A33">endure</text>       <text x="230" y="416" fill="#6B6480">견디다</text>
    </g>
    <rect x="44" y="434" width="2" height="22" fill="#7C3AED"/>
    <text class="t" x="60" y="452" fill="#9A93AC" font-size="14">계속 붙여넣으세요…</text>

    <!-- 인식 결과 -->
    <rect x="24" y="496" width="392" height="76" rx="16" fill="#F3EEFF"/>
    <circle cx="62" cy="534" r="17" fill="#7C3AED"/>
    <path d="M55 534l5 5 9-10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t" x="92" y="528" fill="#211A33" font-size="15" font-weight="700">20개 단어를 인식했습니다</text>
    <text class="t" x="92" y="551" fill="#6B6480" font-size="13">중복 2개는 자동으로 걸렀습니다</text>

    <!-- 교재 사진 스캔 -->
    <rect x="24" y="590" width="392" height="76" rx="16" fill="#fff" stroke="#EAE4F5"/>
    <rect x="44" y="612" width="34" height="32" rx="8" fill="#F3EEFF"/>
    <path d="M52 636v-12l7-6h8l7 6v12z" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="61" cy="630" r="4.5" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
    <text class="t" x="92" y="622" fill="#211A33" font-size="15" font-weight="700">교재 사진으로 넣기</text>
    <text class="t" x="92" y="645" fill="#6B6480" font-size="13">교재를 찍으면 단어–뜻이 자동 등록</text>

    <!-- 숙제 설정 -->
    <text class="t" x="24" y="710" fill="#211A33" font-size="17" font-weight="700">숙제로 내보내기</text>
    <rect x="24" y="724" width="392" height="60" rx="14" fill="#fff" stroke="#EAE4F5"/>
    <text class="t" x="44" y="760" fill="#211A33" font-size="15" font-weight="600">제출 기한</text>
    <text class="t" x="396" y="760" fill="#6B6480" font-size="15" text-anchor="end">금요일 오후 6시</text>

    <rect x="24" y="794" width="392" height="60" rx="14" fill="#fff" stroke="#EAE4F5"/>
    <text class="t" x="44" y="830" fill="#211A33" font-size="15" font-weight="600">받는 반</text>
    <text class="t" x="396" y="830" fill="#6B6480" font-size="15" text-anchor="end">3학년 2반 · 28명</text>

    <rect x="24" y="866" width="392" height="56" rx="14" fill="#7C3AED"/>
    <text class="t" x="220" y="900" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">20개 단어 배포하기</text>
  </g>
</svg>
